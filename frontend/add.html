<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Student Records
        </title>
        <link rel="stylesheet" href="style.css?v=2">
        <script src="js/main.js" defer></script>
        <script src="js/dashboard.js?v=4" defer></script>
        <script src="js/search.js" defer></script>
        <script src="js/delete.js" defer></script>
        <script src="js/add.js" defer></script>
    </head>
    <body data-page="add" class="modal-open">
        <a class="skip-link" href="#main-content">
            Skip to student records
        </a>
        <div class="app-shell">
            <div class="workspace">
                <header class="topbar">
                    <div class="header-brand">
                        Student Records Management System
                    </div>
                </header>
                <main id="main-content" tabindex="-1">
                    <div class="content-card">
                        <div class="page-heading">
                            <div>
                                <h1>
                                    Student Records
                                </h1>
                            </div>
                        </div>
                        <div id="page-message" class="alert" role="status" hidden>
                        </div>
                        <section id="student-records" class="records-panel" aria-label="Student records directory">
                            <noscript>
                                <p>
                                    Enable JavaScript to load and manage student records.
                                </p>
                            </noscript>
                            <div class="records-toolbar">
                                <form class="search" method="get" action="dashboard.html" role="search">
                                    <div class="search-field">
                                        <img class="icon" src="assets/search.png" width="18" height="18" alt="">
                                        <input type="search" name="q" aria-label="Search students" placeholder="Search by student ID, name, email or course..." value="">
                                    </div>
                                    <button class="button primary" type="submit">
                                        Search
                                    </button>
                                    <a id="clear-search" class="clear-search" href="dashboard.html" hidden>Clear</a>
                                </form>
                                <a class="button primary" href="add.html?v=student-id-2"><img class="button-icon" src="assets/add.png" width="16" height="16" alt=""> Add Student</a>
                            </div>
                            <div class="tablewrap" role="region" aria-label="Student records table, scroll horizontally on small screens" tabindex="0">
                                <table>
                                    <thead>
                                        <tr>
                                            <th scope="col">
                                                Student ID
                                            </th>
                                            <th scope="col">
                                                Name
                                            </th>
                                            <th scope="col">
                                                Email
                                            </th>
                                            <th scope="col">
                                                Course
                                            </th>
                                            <th scope="col">
                                                Year Level
                                            </th>
                                            <th scope="col">
                                                Actions
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody id="student-rows" aria-live="polite">
                                        <tr>
                                            <td colspan="6" class="empty">
                                                <span>
                                                    Loading student records...
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </div>
        <dialog id="student-modal" class="student-modal" aria-labelledby="modal-title" open>
            <div class="modal-header">
                <h2 id="modal-title">
                    Add Student
                </h2>
                <a class="modal-close" href="dashboard.html" aria-label="Close student form">
                    &times;
                </a>
            </div>
            <form id="student-form" method="post" action="../backend/create.php">
                <div class="modal-body">
                    <p id="form-message" class="alert error" role="alert" hidden>
                    </p>
                    <input type="hidden" name="csrf" value="">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="student_number">
                                Student ID
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="text" id="student_number" name="student_number" maxlength="15" pattern="[0-9]{4}-[0-9]{5}-[A-Z]{2}-[0-9]" title="Use YYYY-#####-AA-#, e.g. 2024-12345-MN-0." required placeholder="e.g. 2024-12345-MN-0" value="">
                        </div>
                        <div class="form-field">
                            <label for="last_name">
                                Last Name
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="text" id="last_name" name="last_name" maxlength="80" required placeholder="e.g. Reyes" value="">
                        </div>
                        <div class="form-field">
                            <label for="first_name">
                                First Name
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="text" id="first_name" name="first_name" maxlength="80" required placeholder="e.g. Andrea" value="">
                        </div>
                        <div class="form-field">
                            <label for="course">
                                Course
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="text" id="course" name="course" maxlength="120" required placeholder="e.g. BS Information Technology" value="">
                        </div>
                        <div class="form-field">
                            <label for="email">
                                Email
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="email" id="email" name="email" maxlength="160" required placeholder="student@school.edu" value="">
                        </div>
                        <div class="form-field">
                            <label for="year_level">
                                Year Level
                                <span aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <select id="year_level" name="year_level" required>
                                <option value="1">
                                    1st Year
                                </option>
                                <option value="2">
                                    2nd Year
                                </option>
                                <option value="3">
                                    3rd Year
                                </option>
                                <option value="4">
                                    4th Year
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <a class="button neutral" href="dashboard.html">
                        Cancel
                    </a>
                    <button id="save-student" class="button primary" type="submit" disabled>
                        Save Student
                    </button>
                </div>
            </form>
        </dialog>
    </body>
</html>
