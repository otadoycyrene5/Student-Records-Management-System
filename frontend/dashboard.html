<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Student Records
        </title>
        <link rel="stylesheet" href="style.css?v=2">
        <script src="js/main.js" defer></script>
        <script src="js/dashboard.js?v=4" defer></script>
        <script src="js/search.js" defer></script>
        <script src="js/delete.js" defer></script>
    </head>
    <body data-page="dashboard">
        <a class="skip-link" href="#main-content">
            Skip to student records
        </a>
        <div class="app-shell">
            <div class="workspace">
                <header class="topbar">
                    <div class="header-brand">
                        Student Records Management System
                    </div>
                </header>
                <main id="main-content" tabindex="-1">
                    <div class="content-card">
                        <div class="page-heading">
                            <div>
                                <h1>
                                    Student Records
                                </h1>
                            </div>
                        </div>
                        <div id="page-message" class="alert" role="status" hidden>
                        </div>
                        <section id="student-records" class="records-panel" aria-label="Student records directory">
                            <noscript>
                                <p>
                                    Enable JavaScript to load and manage student records.
                                </p>
                            </noscript>
                            <div class="records-toolbar">
                                <form class="search" method="get" action="dashboard.html" role="search">
                                    <div class="search-field">
                                        <img class="icon" src="assets/search.png" width="18" height="18" alt="">
                                        <input type="search" name="q" aria-label="Search students" placeholder="Search by student ID, name, email or course..." value="">
                                    </div>
                                    <button class="button primary" type="submit">
                                        Search
                                    </button>
                                    <a id="clear-search" class="clear-search" href="dashboard.html" hidden>Clear</a>
                                </form>
                                <a class="button primary" href="add.html?v=student-id-2"><img class="button-icon" src="assets/add.png" width="16" height="16" alt=""> Add Student</a>
                            </div>
                            <div class="tablewrap" role="region" aria-label="Student records table, scroll horizontally on small screens" tabindex="0">
                                <table>
                                    <thead>
                                        <tr>
                                            <th scope="col">
                                                Student ID
                                            </th>
                                            <th scope="col">
                                                Name
                                            </th>
                                            <th scope="col">
                                                Email
                                            </th>
                                            <th scope="col">
                                                Course
                                            </th>
                                            <th scope="col">
                                                Year Level
                                            </th>
                                            <th scope="col">
                                                Actions
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody id="student-rows" aria-live="polite">
                                        <tr>
                                            <td colspan="6" class="empty">
                                                <span>
                                                    Loading student records...
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
